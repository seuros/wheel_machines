[workspace]
members = ["ext/wheel_machines_native/core", "ext/wheel_machines_native/ffi"]
default-members = ["ext/wheel_machines_native/core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
wheel-machines = { path = "ext/wheel_machines_native/core" }
periscope-machines = ">=0.4"
# magnus's "rb-sys" feature is only for `AsRawValue`: the exact-class check
# compares a value's class with the one resolved at init by identity, which
# no Ruby method (`==`, `eql?`, `instance_of?`) can be redefined to fake.
magnus = { version = "0.9.3", default-features = false, features = ["rb-sys"] }
rb-sys = { version = "0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
